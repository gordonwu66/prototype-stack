[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
readme = "README.md"
authors = [
    { name = "gordonwu66", email = "gordonwu66@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.7",
    "fastapi[standard]>=0.162.0",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.1",
    "python-socketio>=5.18.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# apps/api/alembic/ holds migrations; the import is the library.
known-third-party = ["alembic"]

[tool.pyright]
venvPath = "."
venv = ".venv"
