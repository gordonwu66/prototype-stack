[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
readme = "README.md"
authors = [
    { name = "gordonwu66", email = "gordonwu66@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
venvPath = "."
venv = ".venv"
